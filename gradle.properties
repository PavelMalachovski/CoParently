# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
#
# 4 GB, not the 2 GB this used to be. kapt (Hilt + Room) and R8 are the two heavy phases and
# both spent time in GC at 2 GB; a GitHub `ubuntu-latest` runner has 16 GB and a development
# machine has at least 8, so 4 leaves room for the Kotlin daemon beside it. Lower it here if
# you build on a smaller machine — nothing depends on the exact number.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8

# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
# org.gradle.parallel=true

# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true

# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official

# Enables namespacing of each library's R class so that its R class includes only the
# resources declared in the library itself and none from the library's dependencies,
# thereby reducing the size of the R class for that library
android.nonTransitiveRClass=true

# Enable Kotlin incremental compilation
kotlin.incremental=true

# Reuse task outputs across builds instead of only across a single build's up-to-date checks.
# Local-only (there is no remote cache), which is still worth having in CI: `gradle/actions/
# setup-gradle` caches `~/.gradle/caches` per job, so a re-run of a branch reuses the previous
# run's compiled output rather than starting from source. Locally it is what makes switching
# branches back and forth cheap. Task outputs are keyed on their inputs, so a stale result is
# not a failure mode — if a build looks wrong anyway, `./gradlew --no-build-cache <task>`
# proves it either way, and `clean` remains the answer for stale kapt stubs (see CLAUDE.md).
org.gradle.caching=true

# --- Secrets (do NOT put real values in this tracked file) ---
# These are read by app/build.gradle.kts and exposed via BuildConfig.
# Put real values in ~/.gradle/gradle.properties (outside the repo) or as
# environment variables so they are never committed. Empty is fine for CI
# and for building features that don't exercise Google sign-in / Gemini.
# GOOGLE_CLIENT_SECRET=
# GEMINI_API_KEY=

